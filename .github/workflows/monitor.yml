name: monitor
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h at :17 (off-peak minute)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-deploy-chain
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, diff, verify, build data + digest
        id: pipeline
        continue-on-error: true   # we still publish good data if some sources fail; judged below
        run: |
          set -o pipefail
          python3 pipeline/monitor.py | tee /tmp/monitor.log
          python3 pipeline/verify.py
          python3 pipeline/build_site_data.py
          python3 pipeline/newsletter.py

      - name: Commit snapshots & detected changes
        if: always()
        run: |
          git config user.name "modelsignal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ marketing/digests/ || true
          if git diff --cached --quiet; then
            echo "No new changes detected."
          else
            git commit -m "monitor: update snapshots & changes ($(date -u +%FT%TZ))" --quiet
            git push
          fi

      # GITHUB_TOKEN pushes don't trigger other workflows (anti-recursion),
      # so we deploy the site directly from here.
      - name: Build static site
        if: steps.pipeline.outcome != 'cancelled'
        run: python3 pipeline/ssg.py

      - uses: actions/upload-pages-artifact@v3
        if: steps.pipeline.outcome != 'cancelled'
        with:
          path: site/dist

      - uses: actions/deploy-pages@v4
        if: steps.pipeline.outcome != 'cancelled'
        with:
          emit_telemetry: false

      # ---- Quality gate: partial source failures make the run RED ----
      - name: Quality gate — degraded sources are loud, not silent
        if: always()
        run: python3 pipeline/quality_gate.py
